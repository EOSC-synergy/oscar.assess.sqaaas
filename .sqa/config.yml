config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.0.0
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.woozy-celadon-hummingbird.sh
        container: qc.acc_skanky-seashell-buzzard
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.pasty-blue-opossum.sh
        container: qc.doc_crabby-persimmon-buzzard
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.skanky-coral-dachsbracke.sh
        container: qc.doc_sleazy-lilac-impala
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.scummy-gamboge-quoll.sh
        container: qc.doc_wiggy-tan-binturong
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.randy-teal-jellyfish.sh
        container: qc.lic_smelly-wheat-mole
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.gamy-sepia-avocet.sh
        container: qc.met_jumpy-rose-bulldog
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.gloppy-pumpkin-cuttlefish.sh
        container: qc.sec_paltry-chartreuse-quetzal
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.gloppy-flax-beagle.sh
        container: qc.sec_homely-peach-wolfhound
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.flimsy-puce-bongo.sh
        container: qc.sty_stealthy-amaranth-chameleon
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.cheeky-tangerine-turtle.sh
        container: qc.sty_wheezy-orchid-wolverine
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.stealthy-brown-monkey.sh
        container: qc.sty_ugly-cerise-oyster
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.stealthy-orchid-bulldog.sh
        container: qc.sty_lumpy-mustard-beagle
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.chummy-amber-rottweiler.sh
        container: qc.sty_goopy-lilac-chow
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.cheeky-platinum-rabbit.sh
        container: qc.uni_shaggy-crimson-wildebeest
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.homely-brown-grasshopper.sh
        container: qc.ver_chummy-amber-maltese
timeout: 5400
