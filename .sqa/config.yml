        commands:
        - /usr/bin/env sh .sqa/script.boysenberry_audacious_walrus.sh
        container: qc.sec_periwinkle_logical_spider
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.fuchsia_sincere_gorilla.sh
        container: qc.sty_ceru_wise_octopus
      github.com/grycap/oscar hadolint:
