        - /usr/bin/env sh .sqa/script.pine_lucky_gibbon.sh
        container: qc.doc_crimson_rustic_chipmunk
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.wave_attentive_falcon.sh
        container: qc.doc_alabaster_stubborn_coyote
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.grape_attentive_grizzly.sh
        container: qc.doc_brown_passionate_bear
