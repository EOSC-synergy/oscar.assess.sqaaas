config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.0.0
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.hazy-ecru-avocet.sh
        container: qc.acc_shabby-bronze-serval
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.cheeky-heliotrope-cuscus.sh
        container: qc.doc_zippy-eggplant-frise
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.geeky-champagne-husky.sh
        container: qc.doc_gummy-harlequin-snake
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.sloppy-lavender-fousek.sh
        container: qc.doc_ready-dandelion-rat
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.hasty-brown-neanderthal.sh
        container: qc.lic_randy-zucchini-alligator
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.snappy-chocolate-dormouse.sh
        container: qc.met_snippy-ultramarine-snake
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.goopy-magenta-coyote.sh
        container: qc.sec_woolly-scarlet-clam
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.wimpy-yellow-tiger.sh
        container: qc.sec_foggy-apricot-wolfhound
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.woolly-ruby-mandrill.sh
        container: qc.sty_messy-celadon-squirrel
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.greasy-sangria-dane.sh
        container: qc.sty_snazzy-beige-bulldog
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.pasty-orchid-mau.sh
        container: qc.sty_gummy-ultramarine-husky
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.shaky-auburn-oriole.sh
        container: qc.sty_slaphappy-burgundy-ocelot
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.shaggy-corn-cockroach.sh
        container: qc.sty_smelly-cerise-tortoise
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.homely-lemon-civet.sh
        container: qc.uni_grumpy-viridian-iguana
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.scummy-ecru-goat.sh
        container: qc.ver_flaky-amber-turtle
timeout: 5400
