config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v3.7.1
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.bluesy-heliotrope-alligator.sh
        container: qc.acc_pretty-dandelion-heron
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.sickly-vermilion-capybara.sh
        container: qc.doc_cheeky-amethyst-guppy
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.tasty-rose-newt.sh
        container: qc.doc_pokey-cinnabar-rabbit
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.wimpy-champagne-monkey.sh
        container: qc.doc_trippy-white-raccoon
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.flaky-pear-deer.sh
        container: qc.lic_gloppy-yellow-squirrel
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.sunny-pumpkin-dunker.sh
        container: qc.met_shabby-cobalt-jaguar
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.woolly-magnolia-forest.sh
        container: qc.sec_flaky-smalt-wolverine
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.trippy-sepia-balinese.sh
        container: qc.sec_leaky-apricot-dingo
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.breezy-beige-shrimp.sh
        container: qc.sty_droopy-asparagus-nightingale
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-charcoal-serval.sh
        container: qc.sty_hazy-sepia-ant
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.wheezy-eggplant-pinscher.sh
        container: qc.sty_stuffy-auburn-gar
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.cozy-jade-dachsbracke.sh
        container: qc.sty_lovely-silver-catfish
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.crabby-salmon-wasp.sh
        container: qc.sty_droopy-amaranth-wolf
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.lousy-maroon-flounder.sh
        container: qc.uni_craggy-linen-labradoodle
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.wimpy-teal-dalmatian.sh
        container: qc.ver_baggy-cream-frise
timeout: 5400
