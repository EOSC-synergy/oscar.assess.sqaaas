        container: qc.sec_viridian_rustic_caribou
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.claret_vibrant_goose.sh
        container: qc.sec_pumpkin_reliable_penguin
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.strawberry_decisive_moth.sh
        container: qc.sty_reef_worried_gecko
      github.com/grycap/oscar hadolint:
