config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.2.2-rc1
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.zinnia_positive_hawk.sh
        container: qc.acc_porcelain_lucky_lobster
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.beige_authentic_gerbil.sh
        container: qc.doc_ecru_helpful_moose
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.mist_brave_orca.sh
        container: qc.doc_chili_tenacious_termite
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.coral_tenacious_uakari.sh
        container: qc.doc_wheat_sympathetic_moose
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.ceru_peppy_donkey.sh
        container: qc.lic_cloud_lively_camel
  QC.Met:
