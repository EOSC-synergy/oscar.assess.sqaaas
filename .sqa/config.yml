config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.1.0
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.aqua_funny_kookaburra.sh
        container: qc.acc_teal_mysterious_whale
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.moss_outgoing_unicorn.sh
        container: qc.doc_seafoam_confident_turkey
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.turmeric_lively_piranha.sh
        container: qc.doc_wine_peaceful_unicorn
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.ash_inventive_ocelot.sh
        container: qc.doc_aquamarine_humorous_caribou
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.frost_courageous_kraken.sh
        container: qc.lic_poppy_grateful_butterfly
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.cornflower_innocent_bullfrog.sh
        container: qc.met_avocado_logical_salamander
  QC.Sec:
