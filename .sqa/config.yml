config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.3.0-rc.3
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.sand_timid_gull.sh
        container: qc.acc_boysenberry_shrewd_weasel
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.taupe_sweet_ibex.sh
        container: qc.doc_cloud_reliable_hydra
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.rosewater_organized_seal.sh
        container: qc.doc_cloud_studious_mandrill
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.blush_fair_gibbon.sh
        container: qc.doc_pearl_friendly_uakari
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.white_enigmatic_coyote.sh
