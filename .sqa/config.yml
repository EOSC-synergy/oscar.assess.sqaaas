config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.2.0
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.flax_helpful_kraken.sh
        container: qc.acc_claret_happy_seal
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.avocado_innocent_sloth.sh
        container: qc.doc_sienna_mindful_kiwi
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.raven_frugal_falcon.sh
        container: qc.doc_forest_decisive_ibex
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.dusk_stubborn_goat.sh
        container: qc.doc_prussian_foolish_sphinx
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.storm_methodical_barracuda.sh
        container: qc.lic_harlequin_mindful_jellyfish
  QC.Met:
