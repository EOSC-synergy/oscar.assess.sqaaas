config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v3.7.0
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.ready-rust-moose.sh
        container: qc.acc_flabby-buff-fossa
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.trippy-olive-tuatara.sh
        container: qc.doc_slimy-cream-skunk
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.ugly-cardinal-ant.sh
        container: qc.doc_slaphappy-emerald-tarsier
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.surly-plum-echidna.sh
        container: qc.doc_bumpy-apricot-rhinoceros
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.scaly-seashell-frigatebird.sh
        container: qc.lic_gummy-green-ant
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.lousy-olivine-booby.sh
        container: qc.met_squeaky-olivine-mongoose
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.slimy-brass-bracke.sh
        container: qc.sec_fuzzy-coral-husky
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.grumpy-ecru-snail.sh
        container: qc.sec_bumpy-copper-neanderthal
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.hazy-bistre-seal.sh
        container: qc.sty_squirrely-lavender-falcon
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.sickly-chestnut-booby.sh
        container: qc.sty_bumpy-ivory-audemer
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.cozy-cardinal-sheep.sh
        container: qc.sty_randy-turquoise-labradoodle
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.breezy-magnolia-opossum.sh
        container: qc.sty_chummy-olive-dane
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.silly-tan-loon.sh
        container: qc.sty_crappy-lime-akbash
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.slimy-magenta-ocelot.sh
        container: qc.uni_geeky-lavender-chimpanzee
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.lanky-ruby-squid.sh
        container: qc.ver_pretty-green-tang
timeout: 5400
