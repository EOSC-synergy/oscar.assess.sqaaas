config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v.3.6.3
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-russet-wildebeest.sh
        container: qc.acc_lousy-fuchsia-duck
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.chewy-zucchini-dunker.sh
        container: qc.doc_slimy-ecru-labradoodle
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-smalt-duck.sh
        container: qc.doc_stuffy-orange-worm
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.wimpy-buff-tang.sh
        container: qc.doc_woozy-crimson-opossum
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.frumpy-eggplant-cow.sh
        container: qc.lic_clammy-buff-meerkat
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.sloppy-linen-wombat.sh
        container: qc.met_flaky-ecru-nightingale
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.woolly-cerise-kingfisher.sh
        container: qc.sec_scaly-yellow-meerkat
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.sickly-teal-setter.sh
        container: qc.sec_baggy-alizarin-nightingale
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.cranky-viridian-mist.sh
        container: qc.sty_lousy-wheat-toad
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.chummy-fuchsia-hummingbird.sh
        container: qc.sty_pasty-bistre-hummingbird
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.wimpy-champagne-flounder.sh
        container: qc.sty_trippy-vermilion-crane
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.hasty-wheat-maltese.sh
        container: qc.sty_sleazy-wisteria-schnauzer
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-chocolate-labradoodle.sh
        container: qc.sty_boozy-flax-cow
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.snappy-taupe-giraffe.sh
        container: qc.uni_whiny-lemon-spitz
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.wimpy-apricot-buzzard.sh
        container: qc.ver_gimpy-sepia-buzzard
timeout: 5400
