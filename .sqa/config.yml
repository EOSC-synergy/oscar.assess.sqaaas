config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.2.1
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.zinnia_polite_okapi.sh
        container: qc.acc_pink_fierce_leopard
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.ginger_funny_jellyfish.sh
        container: qc.doc_lime_timid_boar
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.butterscotch_alert_bullfrog.sh
        container: qc.doc_fuchsia_ambitious_komodo
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.snow_elated_vulture.sh
        container: qc.doc_sand_rational_hippopotamus
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.yellow_trustworthy_axolotl.sh
        container: qc.lic_paprika_playful_peacock
  QC.Met:
