config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v3.6.2
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.lousy-cyan-mole.sh
        container: qc.acc_cloudy-lilac-tarsier
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-olivine-otter.sh
        container: qc.doc_smelly-asparagus-mule
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.crappy-firebrick-koala.sh
        container: qc.doc_nippy-vermilion-duck
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.craggy-periwinkle-sheep.sh
        container: qc.doc_greasy-bistre-frigatebird
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.cozy-mustard-crab.sh
        container: qc.lic_slimy-sapphire-dogfish
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.scaly-goldenrod-mandrill.sh
        container: qc.met_lumpy-coral-falcon
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.shaky-blue-numbat.sh
        container: qc.sec_messy-emerald-camel
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.messy-green-oriole.sh
        container: qc.sec_greasy-tangerine-discus
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.snazzy-mauve-paradise.sh
        container: qc.sty_clammy-beige-okapi
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.sleazy-cyan-rhinoceros.sh
        container: qc.sty_sloppy-cream-cassowary
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.thirsty-ochre-worm.sh
        container: qc.sty_silly-viridian-dingo
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.seedy-coral-havanese.sh
        container: qc.sty_gamy-jade-warthog
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-beige-cow.sh
        container: qc.sty_silly-auburn-bongo
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-ivory-weasel.sh
        container: qc.uni_hilly-silver-coral
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-wisteria-fossa.sh
        container: qc.ver_bumpy-orange-gorilla
timeout: 5400
