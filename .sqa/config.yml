      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.ultramarine_blissful_komodo.sh
        container: qc.doc_cobalt_generous_baboon
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.cinnamon_cheerful_wildcat.sh
        container: qc.doc_fern_adaptable_cobra
