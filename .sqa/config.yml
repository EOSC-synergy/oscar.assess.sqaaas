config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v3.5.0
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.lumpy-taupe-chinchilla.sh
        container: qc.acc_snazzy-beige-squid
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.lovely-ultramarine-lemming.sh
        container: qc.doc_nippy-seashell-chamois
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.queasy-gold-cat.sh
        container: qc.doc_randy-lavender-stingray
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.nippy-auburn-meerkat.sh
        container: qc.doc_crappy-cinnabar-shrimp
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.lovely-cyan-skunk.sh
        container: qc.lic_scummy-platinum-avocet
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.paltry-purple-cheetah.sh
        container: qc.met_greasy-buff-panda
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.pretty-jade-greyhound.sh
        container: qc.sec_fuzzy-zucchini-mole
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.pokey-xanthic-toucan.sh
        container: qc.sec_flaky-tan-booby
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.lovely-corn-indri.sh
        container: qc.sty_droopy-grey-cockroach
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.cheeky-sangria-slug.sh
        container: qc.sty_stinky-apricot-butterfly
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.smelly-malachite-camel.sh
        container: qc.sty_woozy-celadon-dolphin
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.snappy-mauve-giraffe.sh
        container: qc.sty_lovely-ivory-angora
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.snazzy-sapphire-chipmunk.sh
        container: qc.sty_seedy-coral-mouse
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.lumpy-vermilion-earwig.sh
        container: qc.uni_wimpy-razzmatazz-octopus
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.queasy-scarlet-alligator.sh
        container: qc.ver_wheezy-puce-devil
timeout: 5400
