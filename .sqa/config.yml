config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v3.6.1
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-dandelion-dingo.sh
        container: qc.acc_hilly-malachite-corgi
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.paltry-smalt-skunk.sh
        container: qc.doc_messy-salmon-uakari
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.crabby-lavender-toad.sh
        container: qc.doc_blurry-persimmon-cassowary
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.silly-gamboge-flamingo.sh
        container: qc.doc_paltry-grey-heron
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.scaly-lemon-bee.sh
        container: qc.lic_flaky-persimmon-sheepdog
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.nippy-cerulean-quetzal.sh
        container: qc.met_cheeky-rust-bulldog
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.trippy-beige-peccary.sh
        container: qc.sec_boozy-razzmatazz-monster
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.smelly-khaki-mule.sh
        container: qc.sec_lumpy-ecru-vulture
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.tacky-auburn-chipmunk.sh
        container: qc.sty_geeky-ecru-echidna
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.stuffy-heliotrope-dormouse.sh
        container: qc.sty_ugly-taupe-sponge
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-coral-emu.sh
        container: qc.sty_greasy-saffron-coral
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.skimpy-cornflower-chicken.sh
        container: qc.sty_nippy-ochre-bobcat
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.hilly-aqua-yak.sh
        container: qc.sty_squirrely-wheat-russel
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.trippy-indigo-penguin.sh
        container: qc.uni_lovely-harlequin-emu
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.seedy-celadon-wallaby.sh
        container: qc.ver_trippy-olive-woodpecker
timeout: 5400
