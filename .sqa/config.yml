config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/pynblint_fix
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.0.0
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.seedy-vermilion-monster.sh
        container: qc.acc_snippy-lilac-sponge
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.stuffy-chartreuse-bullfrog.sh
        container: qc.doc_wheezy-indigo-serval
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.homey-fuchsia-chamois.sh
        container: qc.doc_flimsy-denim-turkey
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.skimpy-cobalt-koala.sh
        container: qc.doc_lanky-cinnabar-moose
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.flimsy-salmon-rabbit.sh
        container: qc.lic_paltry-persimmon-bobcat
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.beady-ruby-grouse.sh
        container: qc.met_sickly-platinum-crocodile
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.beady-ultramarine-oyster.sh
        container: qc.sec_snippy-khaki-crocodile
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-peach-sheep.sh
        container: qc.sec_bumpy-olive-retriever
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-copper-chamois.sh
        container: qc.sty_queasy-green-pinscher
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.ugly-periwinkle-tortoise.sh
        container: qc.sty_smelly-pumpkin-hippopotamus
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.frumpy-denim-snake.sh
        container: qc.sty_grumpy-magenta-seahorse
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.dorky-viridian-spider.sh
        container: qc.sty_grumpy-dandelion-spoonbill
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.nerdy-rust-mule.sh
        container: qc.sty_slaphappy-plum-tang
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.shaggy-carmine-havanese.sh
        container: qc.uni_fuzzy-saffron-dragon
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.shaky-denim-coyote.sh
        container: qc.ver_zippy-tan-javanese
timeout: 5400
