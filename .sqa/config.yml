        commands:
        - /usr/bin/env sh .sqa/script.linen_proud_stingray.sh
        container: qc.sec_puce_shrewd_skunk
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.hunter_frugal_puffin.sh
        container: qc.sty_mango_diligent_platypus
      github.com/grycap/oscar hadolint:
