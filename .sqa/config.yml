config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.3.0
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.avocado_shrewd_butterfly.sh
        container: qc.acc_tangerine_vibrant_griffin
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.peach_exuberant_lionfish.sh
        container: qc.doc_ultramarine_audacious_unicorn
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.boysenberry_candid_chimpanzee.sh
        container: qc.doc_goldenrod_vibrant_chipmunk
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.violet_rational_grasshopper.sh
        container: qc.doc_celadon_fair_octopus
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.eggplant_stubborn_gecko.sh
        container: qc.lic_mango_confused_llama
