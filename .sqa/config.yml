config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v3.4.0
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.chewy-sepia-dragon.sh
        container: qc.acc_squirrely-plum-ibis
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.breezy-turquoise-sloth.sh
        container: qc.doc_stealthy-dandelion-wrasse
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.flimsy-jade-dodo.sh
        container: qc.doc_lanky-sepia-otter
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.pretty-rose-peccary.sh
        container: qc.doc_flaky-asparagus-bongo
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.zippy-cardinal-grasshopper.sh
        container: qc.lic_snazzy-chartreuse-toad
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.hasty-plum-axolotl.sh
        container: qc.met_flabby-lavender-lobster
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.flabby-pink-monkey.sh
        container: qc.sec_lousy-myrtle-greyhound
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.snazzy-cream-woodlouse.sh
        container: qc.sec_chummy-magnolia-newfoundland
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.wheezy-alizarin-eel.sh
        container: qc.sty_scanty-orange-zorse
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.crabby-pumpkin-fossa.sh
        container: qc.sty_fuzzy-charcoal-butterfly
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.shaky-cerise-albatross.sh
        container: qc.sty_thirsty-beige-havanese
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.snappy-maroon-buffalo.sh
        container: qc.sty_fuzzy-red-labradoodle
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.cozy-bronze-slug.sh
        container: qc.sty_hazy-lime-tarantula
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.lousy-corn-flamingo.sh
        container: qc.uni_hazy-grey-toad
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.sunny-apricot-grouse.sh
        container: qc.ver_homey-sangria-cat
timeout: 5400
