config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.3.0-rc.1
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.sunset_scrappy_dolphin.sh
        container: qc.acc_mist_perky_ibex
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.forest_reliable_flamingo.sh
        container: qc.doc_tundra_blissful_gorilla
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.cosmos_candid_kraken.sh
        container: qc.doc_heather_lucky_albatross
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.lapis_loyal_dhole.sh
        container: qc.doc_sand_industrious_wildcat
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.coffee_friendly_chameleon.sh
        container: qc.lic_banana_elated_bat
