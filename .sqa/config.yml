config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.2.2-rc1
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.cherry_humorous_seal.sh
        container: qc.acc_umber_eager_gibbon
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.walnut_meticulous_shark.sh
        container: qc.doc_orange_bubbly_leopard
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.mahogany_spontaneous_echidna.sh
        container: qc.doc_flamingo_bright_heron
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.yellow_rugged_spren.sh
        container: qc.doc_plum_passionate_warthog
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.cloud_bewildered_antelope.sh
