config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.3.0
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.silver_calm_mandrill.sh
        container: qc.acc_ice_wondrous_nighthawk
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.viridian_thankful_roc.sh
        container: qc.doc_amaranth_vigilant_ocelot
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.pink_eccentric_falcon.sh
        container: qc.doc_mauve_brilliant_otter
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.ivory_blissful_raven.sh
        container: qc.doc_orchid_optimistic_griffin
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.chartreuse_hopeful_quail.sh
        container: qc.lic_pistachio_resilient_uakari
