        - /usr/bin/env sh .sqa/script.sapphire_carefree_dragonfly.sh
        container: qc.sty_aqua_innocent_roc
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.glacier_innocent_hydra.sh
        container: qc.sty_marigold_honest_bat
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.tangerine_mysterious_swan.sh
        container: qc.uni_cerise_resilient_donkey
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.thistle_agile_cougar.sh
        container: qc.ver_echelon_hardworking_goose
