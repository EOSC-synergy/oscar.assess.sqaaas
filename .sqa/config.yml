        commands:
        - /usr/bin/env sh .sqa/script.khaki_audacious_snail.sh
        container: qc.sec_clove_smart_lobster
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.turquoise_practical_walrus.sh
        container: qc.sty_banana_energetic_elk
