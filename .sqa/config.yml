      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.cinnamon_outgoing_armadillo.sh
        container: qc.sec_frost_productive_piranha
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.apricot_enthusiastic_hippopotamus.sh
        container: qc.sec_wine_tough_hornbill
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.glacier_forgiving_anaconda.sh
        container: qc.sty_marigold_lively_flounder
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.mint_enigmatic_pelican.sh
