config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.2.2-rc1
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.ice_hopeful_roc.sh
        container: qc.acc_sepia_reckless_heron
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.cinnamon_delighted_rattlesnake.sh
        container: qc.doc_heather_reckless_quoll
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.persimmon_innocent_salamander.sh
        container: qc.doc_ice_outgoing_condor
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.copper_grateful_eagle.sh
        container: qc.doc_cerise_worried_phoenix
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.salmon_focused_caiman.sh
        container: qc.lic_amethyst_shy_octopus
