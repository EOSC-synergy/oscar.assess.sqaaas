config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v3.6.3
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.breezy-turquoise-monkey.sh
        container: qc.acc_messy-myrtle-fousek
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.flabby-razzmatazz-mau.sh
        container: qc.doc_smelly-cornflower-earwig
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.slaphappy-carmine-molly.sh
        container: qc.doc_gloppy-gold-okapi
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.sleazy-rose-octopus.sh
        container: qc.doc_foggy-heliotrope-swan
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-burgundy-octopus.sh
        container: qc.lic_cozy-maroon-gopher
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.jumpy-mauve-starfish.sh
        container: qc.met_stinky-scarlet-lemming
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.cranky-goldenrod-meerkat.sh
        container: qc.sec_paltry-russet-lion
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.flabby-mustard-rat.sh
        container: qc.sec_snoopy-orange-setter
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.homely-gold-toad.sh
        container: qc.sty_fuzzy-red-leopard
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.breezy-chocolate-pinscher.sh
        container: qc.sty_seedy-bistre-warthog
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.sleazy-amethyst-avocet.sh
        container: qc.sty_snippy-linen-cattle
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.lanky-tomato-hippopotamus.sh
        container: qc.sty_seedy-gold-albatross
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.gummy-violet-bird.sh
        container: qc.sty_cozy-maroon-ferret
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.stinky-mauve-heron.sh
        container: qc.uni_slaphappy-yellow-coral
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.randy-cerise-heron.sh
        container: qc.ver_squeaky-ruby-hare
timeout: 5400
