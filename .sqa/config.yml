        container: qc.sec_carmine_feisty_mandrill
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.fog_lucky_mink.sh
        container: qc.sec_cornflower_sweet_stingray
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.dahlia_playful_seahorse.sh
        container: qc.sty_heather_zany_chipmunk
      github.com/grycap/oscar hadolint:
