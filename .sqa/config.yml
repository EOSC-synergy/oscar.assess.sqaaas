      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.reef_scrappy_weasel.sh
        container: qc.doc_lagoon_whimsical_frog
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.sapphire_fearless_parrot.sh
        container: qc.doc_orange_pensive_jaguar
  QC.Lic:
