      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.peach_forgiving_ocelot.sh
        container: qc.doc_chili_goofy_turkey
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.pink_wise_gecko.sh
        container: qc.doc_dusk_affectionate_spider
