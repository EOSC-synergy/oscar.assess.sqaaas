config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v3.6.4
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.randy-cobalt-shrew.sh
        container: qc.acc_foggy-fuchsia-manatee
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.lousy-aquamarine-goose.sh
        container: qc.doc_goopy-olivine-wolfhound
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.scanty-wheat-dragon.sh
        container: qc.doc_foggy-grey-cassowary
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.pasty-xanthic-octopus.sh
        container: qc.doc_ready-denim-balinese
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.geeky-khaki-mongoose.sh
        container: qc.lic_chummy-pumpkin-barnacle
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.snazzy-myrtle-albatross.sh
        container: qc.met_sleepy-gold-barracuda
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.ugly-red-bulldog.sh
        container: qc.sec_ugly-khaki-spaniel
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.lumpy-lime-blue.sh
        container: qc.sec_cloudy-pink-sheepdog
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.lovely-vermilion-wolverine.sh
        container: qc.sty_homey-amaranth-binturong
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.clammy-amethyst-eagle.sh
        container: qc.sty_skimpy-silver-dog
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.fuzzy-amethyst-tamarin.sh
        container: qc.sty_pasty-silver-ostrich
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.skanky-apricot-cuttlefish.sh
        container: qc.sty_craggy-teal-camel
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.zippy-pink-salamander.sh
        container: qc.sty_wimpy-pear-rottweiler
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.dorky-cerulean-mouse.sh
        container: qc.uni_droopy-aquamarine-capuchin
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-lemon-gerbil.sh
        container: qc.ver_pretty-ochre-tapir
timeout: 5400
