config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v3.5.1
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.lanky-persimmon-impala.sh
        container: qc.acc_surly-bistre-toucan
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.hazy-celadon-spoonbill.sh
        container: qc.doc_skanky-magenta-fly
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.slaphappy-plum-otter.sh
        container: qc.doc_sleepy-aquamarine-kingfisher
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.shaggy-asparagus-dormouse.sh
        container: qc.doc_nippy-amaranth-squirrel
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.lovely-cinnabar-wasp.sh
        container: qc.lic_paltry-dandelion-centipede
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.woozy-chocolate-butterfly.sh
        container: qc.met_grumpy-ivory-chamois
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.hazy-olivine-dane.sh
        container: qc.sec_fuzzy-aqua-flounder
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.pokey-silver-spider.sh
        container: qc.sec_crappy-cornflower-chameleon
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-russet-squirrel.sh
        container: qc.sty_muggy-coral-antelope
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.pokey-russet-fish.sh
        container: qc.sty_gummy-violet-baboon
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.sickly-salmon-akita.sh
        container: qc.sty_wiggy-silver-dane
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.smelly-purple-zonkey.sh
        container: qc.sty_baggy-cerise-mongrel
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.pokey-silver-penguin.sh
        container: qc.sty_skanky-pink-quetzal
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.crabby-tomato-hound.sh
        container: qc.uni_sleazy-viridian-orangutan
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.hazy-mauve-zebu.sh
        container: qc.ver_frumpy-platinum-dollar
timeout: 5400
