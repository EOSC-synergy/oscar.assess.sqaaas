config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v3.6.5
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.snazzy-goldenrod-paradise.sh
        container: qc.acc_woolly-white-uakari
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.pokey-vermilion-frise.sh
        container: qc.doc_tasty-olive-wolverine
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.lousy-dandelion-zorse.sh
        container: qc.doc_tacky-mauve-malamute
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.pasty-purple-wombat.sh
        container: qc.doc_droopy-orchid-wasp
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.sickly-taupe-malamute.sh
        container: qc.lic_bluesy-corn-bullfrog
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.cheeky-ivory-terrier.sh
        container: qc.met_goopy-amaranth-coati
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.sleazy-flax-dog.sh
        container: qc.sec_woolly-malachite-spaniel
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.pokey-rust-weasel.sh
        container: qc.sec_sickly-ecru-grouse
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.shaggy-chocolate-capybara.sh
        container: qc.sty_droopy-chartreuse-maltese
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.paltry-aqua-impala.sh
        container: qc.sty_wimpy-seashell-indri
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.clammy-pear-mole.sh
        container: qc.sty_stinky-puce-squid
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.gloppy-coral-lobster.sh
        container: qc.sty_paltry-cardinal-jaguar
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.muzzy-beige-numbat.sh
        container: qc.sty_whiny-gold-collie
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.freaky-ultramarine-slug.sh
        container: qc.uni_greasy-indigo-eagle
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.gamy-black-horse.sh
        container: qc.ver_bluesy-indigo-giraffe
timeout: 5400
