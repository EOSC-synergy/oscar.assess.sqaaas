      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.chartreuse_ambitious_gazelle.sh
        container: qc.doc_boysenberry_sarcastic_falcon
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.obsidian_persistent_coyote.sh
        container: qc.doc_champagne_imaginative_roc
