        - /usr/bin/env sh .sqa/script.crimson_polite_koala.sh
        container: qc.sec_tan_dizzy_chameleon
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.grape_blissful_hyena.sh
        container: qc.sec_chestnut_productive_cormorant
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.lilac_bubbly_moose.sh
        container: qc.sty_bronze_analytical_jaguar
      github.com/grycap/oscar hadolint:
