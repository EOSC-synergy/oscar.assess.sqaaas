config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.2.2-rc.1
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.ivory_mature_manatee.sh
        container: qc.acc_amethyst_open_groundhog
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.orchid_delighted_leopard.sh
        container: qc.doc_lagoon_friendly_parrot
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.espresso_assured_buffalo.sh
        container: qc.doc_scarlet_devoted_rhinoceros
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.jade_melancholy_hummingbird.sh
        container: qc.doc_verdant_rustic_hedgehog
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.powder_tactful_impala.sh
        container: qc.lic_walnut_stubborn_hare
