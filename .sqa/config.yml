config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/oscar:
      branch: v4.2.3-rc.1
      repo: https://github.com/grycap/oscar
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.fog_affectionate_kiwi.sh
        container: qc.acc_silver_dreamy_dormouse
  QC.Doc:
    repos:
      github.com/grycap/oscar find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.crimson_upbeat_panda.sh
        container: qc.doc_coral_diligent_eagle
      github.com/grycap/oscar git:
        commands:
        - /usr/bin/env sh .sqa/script.saffron_frugal_coyote.sh
        container: qc.doc_grege_tactful_seahorse
      github.com/grycap/oscar markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.cloud_nurturing_bullfrog.sh
        container: qc.doc_ochre_serene_mongoose
  QC.Lic:
    repos:
      github.com/grycap/oscar licensee:
        commands:
        - /usr/bin/env sh .sqa/script.sage_humble_hawk.sh
        container: qc.lic_lemon_foolish_chameleon
  QC.Met:
    repos:
      github.com/grycap/oscar validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.onyx_gracious_kookaburra.sh
        container: qc.met_dusk_helpful_turtle
  QC.Sec:
    repos:
      github.com/grycap/oscar bandit:
        commands:
        - /usr/bin/env sh .sqa/script.eggplant_assured_hedgehog.sh
        container: qc.sec_echelon_meticulous_quokka
      github.com/grycap/oscar gosec:
        commands:
        - /usr/bin/env sh .sqa/script.jasmine_happy_grasshopper.sh
        container: qc.sec_royal_frugal_serval
  QC.Sty:
    repos:
      github.com/grycap/oscar flake8:
        commands:
        - /usr/bin/env sh .sqa/script.cayenne_timid_bullfrog.sh
        container: qc.sty_mustard_positive_penguin
      github.com/grycap/oscar hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.salmon_scrappy_starfish.sh
        container: qc.sty_cinnabar_careful_pelican
      github.com/grycap/oscar jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.flint_inventive_cobra.sh
        container: qc.sty_espresso_upbeat_meerkat
      github.com/grycap/oscar oclint:
        commands:
        - /usr/bin/env sh .sqa/script.mahogany_proactive_ibis.sh
        container: qc.sty_persimmon_diligent_nighthawk
      github.com/grycap/oscar staticcheck:
        commands:
        - /usr/bin/env sh .sqa/script.gold_reliable_lobster.sh
        container: qc.sty_royal_humble_echidna
  QC.Uni:
    repos:
      github.com/grycap/oscar commands:
        commands:
        - /usr/bin/env sh .sqa/script.bronze_grumpy_dragon.sh
        container: qc.uni_navy_amiable_eagle
  QC.Ver:
    repos:
      github.com/grycap/oscar get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.cyan_happy_turtle.sh
        container: qc.ver_pink_empathetic_skunk
timeout: 5400
